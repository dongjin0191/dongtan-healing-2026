name: 동기연TV 최신 영상 갱신
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 채널 피드에서 최신 영상 목록 만들기
        run: |
          curl -fsSL "https://www.youtube.com/feeds/videos.xml?channel_id=UCe9EKGEd_b9JsLAji1TRAqA" -o feed.xml
          node -e '
            const fs = require("fs");
            const x = fs.readFileSync("feed.xml", "utf8");
            const out = [];
            const re = /<entry>([\s\S]*?)<\/entry>/g; let m;
            while ((m = re.exec(x)) && out.length < 8) {
              const id = (m[1].match(/<yt:videoId>([^<]+)</) || [])[1];
              const t = (m[1].match(/<title>([^<]*)</) || [])[1] || "";
              if (id) out.push({ id, title: t.replace(/&amp;/g, "&").replace(/&quot;/g, "\"").replace(/&#39;/g, "\x27") });
            }
            if (!out.length) { console.error("no entries"); process.exit(1); }
            fs.writeFileSync("videos.json", JSON.stringify(out, null, 1));
          '
          rm -f feed.xml
      - name: 바뀐 경우에만 저장
        run: |
          if ! git diff --quiet -- videos.json; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add videos.json
            git commit -m "동기연TV 최신 영상 목록 갱신"
            git push
          fi
