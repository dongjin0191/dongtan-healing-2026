name: 가을힐링여행 드라이브 사진 갱신
on:
  schedule:
    - cron: "10,30,50 * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/scripts/drive-photos.js
      - .github/workflows/photos.yml
permissions:
  contents: write
concurrency:
  group: photos-${{ github.ref }}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 드라이브 여행사진 폴더에서 사진 목록 만들기
        env:
          # 가을힐링여행 > 여행사진 폴더 (또는 그 상위 폴더) 주소의 마지막 부분
          PHOTO_FOLDER: ${{ vars.PHOTO_FOLDER || '17OtEn8B5kOX8kCBNo7MQjILzef5GXb_x' }}
        run: node .github/scripts/drive-photos.js
      - name: 바뀐 경우에만 저장
        run: |
          git add -N photos.json
          if ! git diff --quiet -- photos.json; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add photos.json
            git commit -m "가을힐링여행 드라이브 사진 목록 갱신"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
